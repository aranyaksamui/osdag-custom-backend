name: osdag-secure-auth-system

services:
  # Database
  database:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osdag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  # Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && npm run dev"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data: