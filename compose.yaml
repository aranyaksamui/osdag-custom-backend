name: osdag-secure-auth-system

services:
  # Database service
  database:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osdag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  # Backend service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      database:
        condition: service_healthy

  # Prisma studio for database visualization
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5555:5555"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma studio --port 5555 --browser none"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data: